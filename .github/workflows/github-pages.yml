name: Publish static guest site
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Optional custom domain'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:static
      - run: npm run typecheck
      - run: npm run test:quiz
      - name: Configure Pages
        uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:static
        env:
          SOLO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Set custom domain
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          if [ -n "$DOMAIN" ]; then printf '%s\n' "$DOMAIN" > out/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
